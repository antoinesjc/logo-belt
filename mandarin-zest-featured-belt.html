<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mandarin Zest: Featured in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700&display=swap" rel="stylesheet">
<style>
  /* "Featured in" logo belt. Logos slide in from the side in an endless loop,
     in soft grey that turns to full colour on hover. Hover pauses it.
     Fills any frame height (use 150px; 110px without the label).
     ?label=0 hides the small "As featured in" label.
     To add a logo: put a PNG in logos/ and add a line to LOGOS at the bottom. */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: 'Outfit', system-ui, sans-serif; display: flex; flex-direction: column; justify-content: center; gap: 14px; }

  .label {
    text-align: center; font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #8a7d74;
    display: flex; align-items: center; justify-content: center; gap: 14px;
  }
  .label::before, .label::after { content: ""; height: 1px; width: 48px; background: #e3d3c9; }
  .nolabel .label { display: none; }

  .belt {
    overflow: hidden; display: flex; align-items: center; height: 92px;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent);
            mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent);
  }
  .track { display: flex; align-items: center; width: max-content; animation: roll var(--dur, 30s) linear infinite; will-change: transform; }
  .belt:hover .track { animation-play-state: paused; }
  @keyframes roll { from { transform: translateX(0); } to { transform: translateX(-50%); } }

  .logo {
    flex: none; display: flex; align-items: center; justify-content: center; padding: 0 40px;
    height: 92px;
  }
  .logo img {
    height: var(--h); width: auto; display: block;
    filter: grayscale(1) brightness(.72) contrast(1.15); opacity: .75;
    transition: filter .3s, opacity .3s, transform .3s cubic-bezier(.3,1.6,.5,1);
  }
  .logo:hover img { filter: none; opacity: 1; transform: scale(1.08); }
  /* phones and tablets have no hover: show the logos in colour */
  @media (hover: none) { .logo img { filter: none; opacity: .95; } }

  @media (max-width: 560px) {
    body { gap: 8px; }
    .belt, .logo { height: 70px; }
    .logo { padding: 0 24px; }
    .logo img { height: calc(var(--h) * .72); }
    .label { font-size: 11.5px; }
    .label::before, .label::after { width: 28px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .track { animation: none; flex-wrap: wrap; justify-content: center; width: 100%; }
    .belt { -webkit-mask-image: none; mask-image: none; height: auto; }
    .logo.copy { display: none; }
  }
</style>
</head>
<body>
<div class="label">As featured in</div>
<div class="belt" id="belt" aria-label="Mandarin Zest has been featured in"><div class="track" id="track"></div></div>

<script>
  // ═══════════ LOGOS: file in logos/, name, and display height (px) ═══════════
  // Heights are tuned so every logo looks about the same size:
  // tall logos get a bigger height, wide wordmarks a smaller one.
  var LOGOS = [
    { file: "lodz.png",         name: "City of Łódź",                         h: 66 },
    { file: "thinkchinese.png", name: "ThinkChinese",                         h: 40 },
    { file: "jagiellonian.png", name: "Uniwersytet Jagielloński w Krakowie",  h: 56 },
    { file: "asiaglot.png",     name: "Asiaglot",                             h: 46 },
    { file: "expolingua.png",   name: "Expolingua Berlin",                    h: 44 },
    { file: "polyglot-conference.png", name: "Polyglot Conference",           h: 60 }
  ];
  // ═══════════════════════════════════════════════════════════════════════════

  // The label hides itself in a short frame (under 130px), so old embeds still look right.
  function lab() { document.body.className = (/[?&]label=0\b/.test(location.search) || window.innerHeight < 130) ? "nolabel" : ""; }
  lab(); window.addEventListener("resize", lab);

  var track = document.getElementById("track");
  function set(copy) {
    return LOGOS.map(function (l) {
      return '<div class="logo' + (copy ? ' copy" aria-hidden="true' : "") + '" style="--h:' + l.h + 'px">' +
             '<img src="logos/' + l.file + '" alt="' + (copy ? "" : l.name) + '" title="' + l.name + '"></div>';
    }).join("");
  }

  // Repeat the logos until one set is wider than the screen, then double it,
  // so the loop never shows a gap, even on very wide screens.
  function build() {
    track.innerHTML = set(false);
    var one = track.scrollWidth || 1, reps = Math.max(1, Math.ceil(window.innerWidth / one));
    var half = set(false); for (var i = 1; i < reps; i++) half += set(true);
    track.innerHTML = half + half.replace(/class="logo"/g, 'class="logo copy" aria-hidden="true"').replace(/alt="[^"]*"/g, 'alt=""');
    // constant speed: about 50px per second
    track.style.setProperty("--dur", Math.round((track.scrollWidth / 2) / 50) + "s");
  }
  var imgs = 0;
  track.innerHTML = set(false);
  [].forEach.call(track.querySelectorAll("img"), function (im) {
    if (im.complete) { if (++imgs === LOGOS.length) build(); }
    else im.addEventListener("load", function () { if (++imgs === LOGOS.length) build(); }), im.addEventListener("error", function () { if (++imgs === LOGOS.length) build(); });
  });
  var w = window.innerWidth;
  window.addEventListener("resize", function () { if (Math.abs(window.innerWidth - w) > 80) { w = window.innerWidth; build(); } });
</script>
</body>
</html>
