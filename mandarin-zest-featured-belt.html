<title>Mandarin Zest — Featured In</title>
<style>
  * { box-sizing: border-box; }

  body{
    margin:0;
    background: transparent;
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  .press-belt{
    position: relative;
    background: transparent;
    overflow: hidden;
    height: 96px;
    display: flex;
    align-items: center;
    -webkit-mask-image: linear-gradient(to right, transparent, black 8%, black 92%, transparent);
    mask-image: linear-gradient(to right, transparent, black 8%, black 92%, transparent);
  }

  .press-track{
    display: flex;
    align-items: center;
    gap: 72px;
    width: max-content;
    animation: roll 26s linear infinite;
    will-change: transform;
  }

  .press-belt:hover .press-track{
    animation-play-state: paused;
  }

  @keyframes roll{
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }

  .press-logo{
    flex: 0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    height: 56px;
    opacity: 0.65;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }

  .press-logo:hover{
    opacity: 1;
    transform: translateY(-1px);
  }

  .press-logo img{
    height: 100%;
    width: auto;
    max-width: 220px;
    object-fit: contain;
    display: block;
  }

  @media (prefers-reduced-motion: reduce){
    .press-track{ animation: none; }
  }

  @media (max-width: 560px){
    .press-belt{ height: 64px; }
    .press-logo{ height: 40px; }
    .press-track{ gap: 44px; }
    .press-logo img{ max-width: 140px; }
  }
</style>
